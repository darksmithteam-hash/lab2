<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice Cream for a Cause - Lions Club Fundraiser</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Ice Cream for a Cause</h1>
        <h2>Raising Funds for Lions Club</h2>
    </header>

    <main>
        <section id="intro">
            <p>Join us for a delicious scoop of ice cream and support a great cause! All proceeds go to the Lions Club to help our community.</p>
        </section>

        <section id="flavors">
            <h3>Our Flavors</h3>
            <ul>
                <li>Vanilla</li>
                <li>Chocolate</li>
                <li>Strawberry</li>
                <li>Mint Chocolate Chip</li>
            </ul>
        </section>

        <section id="cta">
            <button id="donate-btn">Donate Now</button>
        </section>
    </main>

    <footer>
        <p>Contact us: contact@lionsclub.org</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
